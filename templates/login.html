<!doctype html>

<html lang="nl">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Inloggen · Collecteteller
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body class="login-page">

    <main class="login-shell">

        <section class="login-intro">

            <span class="eyebrow">
                DIACONIE
            </span>

            <h1>
                Collecteteller
            </h1>

            <p>
                Digitale collectetelling voor een snelle
                en overzichtelijke verwerking van de
                zondagse collectes.
            </p>

        </section>


        <section class="login-card">

            <h2>
                Inloggen
            </h2>

            <p class="login-help">
                Log in om tellingen, collectedoelen en
                Excel-overzichten te bekijken.
            </p>


            {% if fout %}

                <div class="notice error">
                    {{ fout }}
                </div>

            {% endif %}


            <form
                method="post"
                action="/login"
                class="login-form"
            >

                <label>

                    Gebruikersnaam

                    <input
                        name="gebruikersnaam"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </label>


                <label>

                    Wachtwoord

                    <input
                        type="password"
                        name="wachtwoord"
                        autocomplete="current-password"
                        required
                    >

                </label>


                <button
                    class="btn"
                    type="submit"
                >
                    Inloggen
                </button>

            </form>

        </section>

    </main>

</body>

</html>
